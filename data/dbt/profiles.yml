# Local development profile. These are the Compose credentials from
# infra/compose/docker-compose.yml — local-only placeholders, not secrets.
# Deployment supplies its own through the environment.
fitos:
  target: local
  outputs:
    local:
      type: clickhouse
      host: "{{ env_var('FITOS_CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('FITOS_CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('FITOS_CLICKHOUSE_USER', 'fitos') }}"
      password: "{{ env_var('FITOS_CLICKHOUSE_PASSWORD', 'fitos_local_only') }}"
      schema: "{{ env_var('FITOS_CLICKHOUSE_DB', 'fitos') }}"
      secure: False
