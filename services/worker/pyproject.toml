[project]
name = "fitos-worker"
version = "0.0.0"
requires-python = ">=3.11"
# fitos-api for the control-plane models and the gap writer. Detectors run in
# Temporal activities and write gaps to PostgreSQL directly
# (docs/architecture.md §3, "Detect"); the one-inbound-door rule is about the
# browser, and a worker posting its own output back through HTTP would lose the
# transaction that keeps a gap and its run record consistent.
dependencies = [
  "fitos-api",
  "fitos-connector-sdk",
  "fitos-connector-csv",
  "fitos-data",
  "temporalio>=1.8",
]

[tool.uv.sources]
fitos-connector-sdk = { workspace = true }
fitos-connector-csv = { workspace = true }
fitos-data = { workspace = true }
fitos-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitos_worker"]
