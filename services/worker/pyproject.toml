[project]
name = "fitos-worker"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fitos-connector-sdk", "fitos-connector-csv"]

[tool.uv.sources]
fitos-connector-sdk = { workspace = true }
fitos-connector-csv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitos_worker"]
