[project]
name = "fitos"
version = "0.0.0"
description = "FitOS Gap Intelligence — Python services"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/worker", "connectors/sdk", "connectors/csv_upload", "connectors/rest"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# assert, subprocess and hard-coded local passwords are all legitimate in
# tests; every one of them stays enforced in application code.
#
# contract_tests.py is the exception that needs stating: it is test code, but it
# ships as library code under src/ so every connector can inherit the same 14
# checks rather than copying them. A contract each connector reimplements is not
# a contract.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S603"]
"**/contract_tests.py" = ["S101"]
# The canonical tests interrogate ClickHouse's system tables, building queries
# from table names that come from data/canonical/schema.py — our own module
# constants, never a request. S608 is about untrusted interpolation and there is
# none here. S310 is the urllib call to a URL from configuration, which is the
# whole point of an integration test.
"data/canonical/tests/*" = ["S101", "S310", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["services", "connectors", "data"]
asyncio_mode = "auto"
pythonpath = ["data"]
markers = [
  "integration: requires running infrastructure (postgres, clickhouse, minio, temporal)",
]
