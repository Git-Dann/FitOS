[project]
name = "fitos"
version = "0.0.0"
description = "FitOS Gap Intelligence — Python services"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# S101 (assert) is legitimate in tests; enforced everywhere else.
per-file-ignores = { "**/test_*.py" = ["S101"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"
markers = [
  "integration: requires running infrastructure (postgres, clickhouse, minio, temporal)",
]
